name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows-Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # FFmpeg from BtbN is downloaded at most once a week; that also keeps builds going while their
      # download is briefly unavailable.
      - name: FFmpeg-Woche bestimmen
        id: ffweek
        shell: pwsh
        run: '"week=$(Get-Date -UFormat %Y-%V)" >> $env:GITHUB_OUTPUT'

      - name: FFmpeg-Zwischenspeicher
        uses: actions/cache@v5
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ steps.ffweek.outputs.week }}
          restore-keys: ffmpeg-${{ runner.os }}-

      - name: Kompilieren (mit eingebautem FFmpeg)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.ps1 *>&1 | Tee-Object -FilePath build.log

      - name: Compiler-Meldungen als Annotationen
        if: always()
        shell: pwsh
        run: ./.github/scripts/report-diagnostics.ps1 -LogFile build.log

      - name: Ende des Build-Logs bei Fehler
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            $tail = (Get-Content build.log -Tail 25 | Where-Object { $_.Trim() }) -join ' | '
            "::error title=Build-Log (Ende)::$tail"
          }

      - name: Unit-Tests
        shell: pwsh
        timeout-minutes: 10
        run: ./.github/scripts/unit-tests.ps1

      - name: Oberfläche prüfen (Deutsch und Englisch, alle Seiten)
        shell: pwsh
        timeout-minutes: 5
        run: ./.github/scripts/selftest.ps1 -Mode ui

      - name: FFmpeg-Quellangaben anzeigen
        shell: pwsh
        run: |
          $file = 'dist/ClipRing/FFMPEG-SOURCE.txt'
          if (-not (Test-Path $file)) { "::error title=FFmpeg-Quellen::FFMPEG-SOURCE.txt fehlt"; exit 1 }
          "::notice title=FFmpeg-Quellen::" + (((Get-Content $file) | Where-Object { $_ }) -join ' | ')

      - name: Eingebautes FFmpeg prüfen (entpacken, Prüfsumme, Start)
        shell: pwsh
        timeout-minutes: 5
        run: ./.github/scripts/selftest.ps1 -Mode ffmpeg

      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v6
        with:
          name: ClipRing-${{ github.sha }}
          path: dist/ClipRing
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release erstellen
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # FFmpeg from BtbN is downloaded at most once a week; that also keeps builds going while their
      # download is briefly unavailable.
      - name: FFmpeg-Woche bestimmen
        id: ffweek
        shell: pwsh
        run: '"week=$(Get-Date -UFormat %Y-%V)" >> $env:GITHUB_OUTPUT'

      - name: FFmpeg-Zwischenspeicher
        uses: actions/cache@v5
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ steps.ffweek.outputs.week }}
          restore-keys: ffmpeg-${{ runner.os }}-

      - name: Bauen inklusive .NET-Runtime und eingebautem FFmpeg
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.ps1 -SelfContained

      # The release is built again (with .NET included): test exactly what gets published.
      - name: Oberfläche des Release-Builds prüfen
        shell: pwsh
        timeout-minutes: 5
        run: ./.github/scripts/selftest.ps1 -Mode ui

      - name: Eingebautes FFmpeg des Release-Builds prüfen
        shell: pwsh
        timeout-minutes: 5
        run: ./.github/scripts/selftest.ps1 -Mode ffmpeg

      - name: Zip packen
        shell: pwsh
        run: Compress-Archive -Path dist/ClipRing -DestinationPath "dist/ClipRing-${{ github.ref_name }}-win-x64.zip"

      - name: GitHub-Release veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = "dist/ClipRing-${{ github.ref_name }}-win-x64.zip"
          $notes = ".github/release-notes/${{ github.ref_name }}.md"
          $text = if (Test-Path $notes) { Get-Content $notes -Raw } else { '' }
          # Where the sources of the bundled FFmpeg are (GPL), from the build itself.
          $source = 'dist/ClipRing/FFMPEG-SOURCE.txt'
          if (Test-Path $source) {
            $text += "`n### FFmpeg`n`n" + (((Get-Content $source) | Where-Object { $_ }) -join "  `n") + "`n"
          }
          $out = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content $out $text -Encoding UTF8
          $extra = if (Test-Path $notes) { @() } else { @('--generate-notes') }
          gh release create "${{ github.ref_name }}" $zip --title "ClipRing ${{ github.ref_name }}" --notes-file $out @extra
