name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows-Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Kompilieren (mit eingebautem FFmpeg)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.ps1 *>&1 | Tee-Object -FilePath build.log

      - name: Compiler-Meldungen als Annotationen
        if: always()
        shell: pwsh
        run: ./.github/scripts/report-diagnostics.ps1 -LogFile build.log

      - name: Eingebautes FFmpeg prüfen (entpacken, Prüfsumme, Start)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          $p = Start-Process dist/ClipRing/ClipRing.exe -ArgumentList '--selftest-ffmpeg', "`"$report`"" -Wait -PassThru
          $text = if (Test-Path $report) { Get-Content $report -Raw } else { '(kein Bericht)' }
          Write-Host $text
          $summary = (($text -split "`r?`n") | Where-Object { $_ }) -join ', '
          if ($p.ExitCode -eq 0) { "::notice title=Eingebautes FFmpeg::$summary" }
          else { "::error title=Eingebautes FFmpeg::Exit $($p.ExitCode): $summary"; exit 1 }

      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v6
        with:
          name: ClipRing-${{ github.sha }}
          path: dist/ClipRing
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release erstellen
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Bauen inklusive .NET-Runtime und eingebautem FFmpeg
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.ps1 -SelfContained

      - name: Zip packen
        shell: pwsh
        run: Compress-Archive -Path dist/ClipRing -DestinationPath "dist/ClipRing-${{ github.ref_name }}-win-x64.zip"

      - name: GitHub-Release veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" "dist/ClipRing-${{ github.ref_name }}-win-x64.zip" --title "ClipRing ${{ github.ref_name }}" --generate-notes
